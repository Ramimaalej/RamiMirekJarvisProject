<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #0f1522;
  --bg-card: #131b2e;
  --bg-card-hover: #182240;
  --text-primary: #d6e0f0;
  --text-secondary: #7a8aa8;
  --text-dim: #3d4a66;
  --amber: #f0b429;
  --amber-glow: rgba(240, 180, 41, 0.15);
  --cyan: #22d3ee;
  --cyan-glow: rgba(34, 211, 238, 0.12);
  --green: #34d399;
  --red: #f87171;
  --purple: #a78bfa;
  --pink: #f472b6;
  --orange: #fb923c;
  --blue: #60a5fa;
  --border: rgba(240, 180, 41, 0.08);
  --font-display: 'JetBrains Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
}

::selection { background: var(--amber); color: var(--bg-primary); }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* CRT scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: linear-gradient(
    transparent 50%,
    rgba(10, 14, 23, 0.15) 50%
  );
  background-size: 100% 4px;
  pointer-events: none;
  z-index: 9998;
  animation: scanlines 8s linear infinite;
}

@keyframes scanlines {
  0% { background-position: 0 0; }
  100% { background-position: 0 4px; }
}

/* ── Header ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 14, 23, 0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

header h1 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--amber), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-stats {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--text-secondary);
}

.header-stats span {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font-display);
}

.header-stats .count-checked { color: var(--cyan); border-color: rgba(34, 211, 238, 0.2); }
.header-stats .count-total { border-color: rgba(240, 180, 41, 0.2); }

.search-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 14px;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  width: 220px;
  outline: none;
  transition: border-color 0.3s;
}
.search-box:focus { border-color: var(--amber); }
.search-box::placeholder { color: var(--text-dim); }

.header-actions {
  display: flex;
  gap: 8px;
}

.header-actions button {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 14px;
  border-radius: 6px;
  font-family: var(--font-display);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
}
.header-actions button:hover {
  border-color: var(--amber);
  color: var(--amber);
  background: var(--amber-glow);
}

/* ── Layout ── */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 32px 80px;
}

/* ── Category nav ── */
.category-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 32px;
  padding: 16px 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.category-nav a {
  text-decoration: none;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 5px 12px;
  border-radius: 4px;
  color: var(--text-secondary);
  background: var(--bg-card);
  border: 1px solid transparent;
  transition: all 0.2s;
}

.category-nav a:hover {
  border-color: var(--amber);
  color: var(--amber);
}

/* ── Category Section ── */
.category {
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.6s ease forwards;
}

.category:nth-child(2) { animation-delay: 0.05s; }
.category:nth-child(3) { animation-delay: 0.1s; }
.category:nth-child(4) { animation-delay: 0.15s; }
.category:nth-child(5) { animation-delay: 0.2s; }
.category:nth-child(6) { animation-delay: 0.25s; }
.category:nth-child(7) { animation-delay: 0.3s; }
.category:nth-child(8) { animation-delay: 0.35s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.category-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.category-header h2 {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.category-count {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-display);
}

.category-badge {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Questions Grid ── */
.questions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 6px;
}

.question-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-card);
  border: 1px solid transparent;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.question-item:hover {
  background: var(--bg-card-hover);
  border-color: rgba(240, 180, 41, 0.12);
}

.question-item.checked {
  border-color: rgba(34, 211, 238, 0.2);
  background: rgba(34, 211, 238, 0.04);
}

.question-item input[type="checkbox"] {
  appearance: none;
  width: 16px;
  height: 16px;
  border: 2px solid var(--text-dim);
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 3px;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
}

.question-item input[type="checkbox"]:checked {
  background: var(--cyan);
  border-color: var(--cyan);
}

.question-item input[type="checkbox"]:checked::after {
  content: '✓';
  position: absolute;
  inset: -1px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--bg-primary);
}

.question-text {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-primary);
  flex: 1;
}

.question-item.checked .question-text {
  color: var(--text-secondary);
  text-decoration: line-through;
  text-decoration-color: rgba(34, 211, 238, 0.3);
}

.question-tag {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 3px;
  font-family: var(--font-display);
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
  background: rgba(255,255,255,0.04);
  color: var(--text-dim);
}

.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px;
  color: var(--text-dim);
  font-size: 13px;
}

/* ── Progress bar ── */
.progress-container {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: 3px;
  background: var(--bg-secondary);
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--amber), var(--cyan));
  transition: width 0.3s ease;
  width: 0%;
}

/* ── Export Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  max-width: 600px;
  width: 90%;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
}

.modal h3 {
  font-family: var(--font-display);
  font-size: 14px;
  margin-bottom: 12px;
  color: var(--amber);
}

.modal textarea {
  flex: 1;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 12px;
  resize: none;
  min-height: 200px;
}

.modal textarea:focus { outline: none; border-color: var(--amber); }

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  justify-content: flex-end;
}

.modal-actions button {
  padding: 8px 16px;
  border-radius: 4px;
  font-family: var(--font-display);
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: all 0.2s;
}

.modal-actions button:hover { border-color: var(--amber); color: var(--amber); }
.modal-actions .btn-primary { background: var(--amber); color: var(--bg-primary); border-color: var(--amber); }
.modal-actions .btn-primary:hover { background: #d4a028; }

/* ── Responsive ── */
@media (max-width: 768px) {
  header { padding: 12px 16px; flex-direction: column; align-items: stretch; }
  .search-box { width: 100%; }
  .header-stats { justify-content: center; }
  .container { padding: 16px; }
  .questions-grid { grid-template-columns: 1fr; }
}
</style>
</head>

  "Finance & Market": "#fb923c",
  "Maps & Travel": "#34d399",
  "Memory & Knowledge": "#a78bfa",
  "Productivity": "#f0b429",
  "Development": "#60a5fa",
  "AI & Agents": "#22d3ee",
  "Games & Fun": "#f472b6",
  "Skills": "#fb923c",
  "General Chat": "#7a8aa8",
  "Remote & Monitoring": "#34d399",
  "Forensics & Security": "#f87171",
};

function buildApp() {
  const cats = {};
  QUESTIONS.forEach((q, i) => {
    q.id = i;
    if (!cats[q.cat]) cats[q.cat] = [];
    cats[q.cat].push(q);
  });

  const app = document.getElementById('app');
  let html = '<div class="category-nav">';
  const catNames = Object.keys(cats);
  catNames.forEach(c => {
    html += `<a href="#cat-${c.replace(/\s+/g,'-')}">${c}</a>`;
  });
  html += '</div>';

  catNames.forEach(c => {
    const items = cats[c];
    const color = catColors[c] || '#7a8aa8';
    html += `<div class="category" id="cat-${c.replace(/\s+/g,'-')}">`;
    html += `<div class="category-header">`;
    html += `<span class="category-badge" style="background:${color}"></span>`;
    html += `<h2>${c}</h2>`;
    html += `<span class="category-count">${items.length}</span>`;
    html += `</div><div class="questions-grid">`;
    items.forEach(q => {
      html += `<label class="question-item" data-id="${q.id}">`;
      html += `<input type="checkbox" data-id="${q.id}" onchange="updateChecked()">`;
      html += `<span class="question-text">${q.q}</span>`;
      html += `<span class="question-tag">${q.tag}</span>`;
      html += `</label>`;
    });
    html += `</div></div>`;
  });

  app.innerHTML = html;
  document.getElementById('totalCount').textContent = QUESTIONS.length;
  loadState();
  updateChecked();
}

// ── Persistence (localStorage) ──
function saveState() {
  const checked = [];
  document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
    checked.push(parseInt(cb.dataset.id));
  });
  localStorage.setItem('jarvis_test_checked', JSON.stringify(checked));
}

function loadState() {
  const saved = localStorage.getItem('jarvis_test_checked');
  if (!saved) return;
  const ids = JSON.parse(saved);
  ids.forEach(id => {
    const cb = document.querySelector(`input[data-id="${id}"]`);
    if (cb) cb.checked = true;
  });
}

function updateChecked() {
  const total = QUESTIONS.length;
  const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
  document.getElementById('checkedCount').textContent = checked;
  document.getElementById('progressBar').style.width = `${(checked / total) * 100}%`;
  saveState();
}

function clearChecked() {
  if (!confirm('Reset all checkboxes?')) return;
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
  updateChecked();
}

function filterQuestions() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  document.querySelectorAll('.question-item').forEach(item => {
    const text = item.querySelector('.question-text').textContent.toLowerCase();
    const tag = item.querySelector('.question-tag').textContent.toLowerCase();
    const cat = item.closest('.category')?.querySelector('h2')?.textContent.toLowerCase() || '';
    item.style.display = (!q || text.includes(q) || tag.includes(q) || cat.includes(q)) ? '' : 'none';
  });
}

function exportChecked() {
  const checked = [];
  document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
    const id = parseInt(cb.dataset.id);
    const q = QUESTIONS.find(x => x.id === id);
    if (q) checked.push(`[${q.cat}] ${q.q}`);
  });
  const text = checked.length
    ? `JARVIS Test Results (${checked.length}/${QUESTIONS.length} completed)\n${'='.repeat(50)}\n\n` + checked.join('\n')
    : 'No questions checked yet.';
  document.getElementById('exportText').value = text;
  document.getElementById('exportModal').classList.add('active');
}

function closeExport() {
  document.getElementById('exportModal').classList.remove('active');
}

function copyExport() {
  const ta = document.getElementById('exportText');
  ta.select();
  navigator.clipboard?.writeText(ta.value);
}

buildApp();
</script>
</body>
</html>
